name: "06"
services:
  db:
    image: mariadb:12.3-noble
    container_name: "mariadb_db"
    networks:
      - mi_red
    volumes:
      - db_data:/var/lib/mysql:Z
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 5s    # Cada cuánto tiempo hace la prueba
      timeout: 3s     # Cuánto tiempo espera una respuesta antes de fallar
      retries: 3      # Cuántos intentos fallidos permiten antes de marcarlo como "unhealthy"
      start_period: 10s # Tiempo de gracia al inicio mientras arranca el sistema
    # 🔄 Política de reinicio si el contenedor llega a fallar por un error interno
    restart: always

  web_dba:
    image: adminer:6.0.1-standalone
    container_name: "adminer"
    ports:
      - "3333:8080"
    networks:
      - mi_red
    # ⏱️ Configuración avanzada de dependencia
    depends_on:
      db:
        condition: service_healthy # Espera a que el healthcheck de 'db' sea exitoso

networks:
  mi_red:
    driver: bridge

volumes:
  db_data:
